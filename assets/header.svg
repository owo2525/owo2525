<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
  <title id="title">owo2525 — Ami UI Profile Header</title>
  <desc id="desc">owo2525 GitHub profile banner styled with the Ami UI light-blue and lavender translucent card design system, responsive for desktop and mobile.</desc>
  <style>
    .mobile-layout { display: none; }
    @media (max-width: 560px) {
      .desktop-layout { display: none; }
      .mobile-layout { display: block; }
    }
  </style>
  <defs>
    <linearGradient id="ami-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8FF"/>
      <stop offset="54%" stop-color="#A8D8F0"/>
      <stop offset="100%" stop-color="#C5C9E3"/>
    </linearGradient>
    <linearGradient id="motif-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8FF"/>
      <stop offset="100%" stop-color="#E7F4FD"/>
    </linearGradient>
    <clipPath id="outer-clip">
      <rect width="880" height="390" rx="20"/>
    </clipPath>
    <clipPath id="mini-card-clip">
      <rect x="540" y="58" width="288" height="274" rx="20"/>
    </clipPath>
    <filter id="card-shadow" x="-5%" y="-8%" width="110%" height="122%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#414D70" flood-opacity="0.10"/>
    </filter>
    <filter id="mini-shadow" x="-8%" y="-10%" width="116%" height="126%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#414D70" flood-opacity="0.08"/>
    </filter>
    <pattern id="soft-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#414D70" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Outer Ami UI pastel gradient canvas -->
  <g clip-path="url(#outer-clip)">
    <rect width="880" height="390" fill="url(#ami-bg)"/>
    <rect width="880" height="390" fill="url(#soft-dots)"/>
    <circle cx="120" cy="36" r="180" fill="#FFFFFF" fill-opacity="0.45"/>
    <circle cx="770" cy="355" r="200" fill="#65BFF5" fill-opacity="0.18"/>
  </g>

  <!-- Main translucent white Ami card -->
  <rect x="20" y="20" width="840" height="350" rx="20" fill="#FFFFFF" fill-opacity="0.92" stroke="#D8E0EC" stroke-width="1.2" filter="url(#card-shadow)"/>

  <!-- Desktop layout (2 columns) -->
  <g class="desktop-layout" font-family="'Noto Sans JP', 'Yu Gothic UI', 'Segoe UI', 'Meiryo', sans-serif">
    <!-- Accent heading -->
    <circle cx="58" cy="69" r="4.5" fill="#65BFF5"/>
    <text x="72" y="74" font-size="13" font-weight="600" letter-spacing="2" fill="#59657E">OWO2525 / PROFILE</text>
    <line x1="264" y1="69.5" x2="314" y2="69.5" stroke="#65BFF5" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Hero title -->
    <text x="50" y="154" font-size="68" font-weight="700" letter-spacing="-2" fill="#414D70">owo2525<tspan fill="#65BFF5">.</tspan></text>

    <!-- Subtitle -->
    <text x="52" y="198" font-size="18" font-weight="600" fill="#414D70">Interfaces, apps, systems &amp; playable worlds.</text>
    <text x="52" y="226" font-size="13.5" font-weight="400" fill="#59657E">Choosing the languages and frameworks that fit what I want to build.</text>

    <!-- Focus chips (2 clean rows) -->
    <g font-size="12.5" font-weight="600" fill="#414D70" text-anchor="middle">
      <rect x="52" y="252" width="136" height="32" rx="11" fill="#F4F8FF" stroke="#D8E0EC" stroke-width="1"/>
      <text x="120" y="272.5">Web / Frontend</text>

      <rect x="198" y="252" width="142" height="32" rx="11" fill="#F4F8FF" stroke="#D8E0EC" stroke-width="1"/>
      <text x="269" y="272.5">Flutter / Mobile</text>

      <rect x="350" y="252" width="114" height="32" rx="11" fill="#F4F8FF" stroke="#D8E0EC" stroke-width="1"/>
      <text x="407" y="272.5">C++ / Java</text>

      <rect x="52" y="294" width="148" height="32" rx="11" fill="#F4F8FF" stroke="#D8E0EC" stroke-width="1"/>
      <text x="126" y="314.5">Cloud &amp; Delivery</text>

      <rect x="210" y="294" width="148" height="32" rx="11" fill="#F4F8FF" stroke="#D8E0EC" stroke-width="1"/>
      <text x="284" y="314.5">Scripts &amp; Mods</text>
    </g>

    <!-- Bottom metadata -->
    <text x="52" y="350" font-size="11" font-weight="500" letter-spacing="1.6" fill="#59657E">AMI DESIGN THEME · GITHUB PROFILE</text>

    <!-- Right column: Soft halo + Ami UI mini card -->
    <circle cx="808" cy="78" r="38" fill="#A8D8F0" fill-opacity="0.34"/>
    <circle cx="556" cy="310" r="30" fill="#C5C9E3" fill-opacity="0.40"/>

    <g filter="url(#mini-shadow)">
      <rect x="540" y="58" width="288" height="274" rx="20" fill="#FFFFFF" stroke="#D8E0EC" stroke-width="1.2"/>
    </g>

    <g clip-path="url(#mini-card-clip)">
      <rect x="540" y="58" width="288" height="38" fill="#F4F8FF"/>
      <line x1="540" y1="96" x2="828" y2="96" stroke="#D8E0EC" stroke-width="1"/>
      <circle cx="564" cy="77" r="4.2" fill="#A8D8F0"/>
      <circle cx="578" cy="77" r="4.2" fill="#C5C9E3"/>
      <circle cx="592" cy="77" r="4.2" fill="#65BFF5"/>
      <text x="808" y="81" text-anchor="end" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="600" letter-spacing="1" fill="#59657E">owo.profile</text>
    </g>

    <!-- owo motif panel -->
    <rect x="562" y="116" width="244" height="140" rx="16" fill="url(#motif-bg)" stroke="#A8D8F0" stroke-width="1.2"/>
    <g>
      <circle cx="604" cy="148" r="3" fill="#C5C9E3"/>
      <circle cx="764" cy="216" r="3.5" fill="#65BFF5" fill-opacity="0.75"/>
      <circle cx="772" cy="152" r="2.5" fill="#A8D8F0"/>
      <circle cx="642" cy="186" r="17" fill="#FFFFFF" stroke="#65BFF5" stroke-width="3.8"/>
      <circle cx="636" cy="180" r="3.2" fill="#A8D8F0"/>
      <path d="M668 181 Q676 198 684 185 Q692 198 700 181" fill="none" stroke="#414D70" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="726" cy="186" r="17" fill="#FFFFFF" stroke="#65BFF5" stroke-width="3.8"/>
      <circle cx="720" cy="180" r="3.2" fill="#A8D8F0"/>
    </g>

    <!-- Status row -->
    <circle cx="570" cy="292" r="4.5" fill="#16734A"/>
    <text x="583" y="296.5" font-size="12.5" font-weight="500" fill="#414D70">Building across web, mobile &amp; native</text>
  </g>

  <!-- Mobile layout (1 column, high legibility on small screens) -->
  <g class="mobile-layout" font-family="'Noto Sans JP', 'Yu Gothic UI', 'Segoe UI', 'Meiryo', sans-serif">
    <circle cx="70" cy="88" r="6" fill="#65BFF5"/>
    <text x="90" y="95" font-size="22" font-weight="600" letter-spacing="2.4" fill="#59657E">OWO2525 / PROFILE</text>
    <rect x="696" y="64" width="120" height="46" rx="14" fill="url(#motif-bg)" stroke="#A8D8F0" stroke-width="1.5"/>
    <text x="756" y="95" text-anchor="middle" font-size="24" font-weight="700" fill="#414D70">owo</text>

    <text x="64" y="216" font-size="112" font-weight="700" letter-spacing="-3" fill="#414D70">owo2525<tspan fill="#65BFF5">.</tspan></text>
    <text x="66" y="278" font-size="31" font-weight="600" fill="#414D70">Interfaces, apps, systems &amp; game worlds.</text>
    <line x1="66" y1="316" x2="186" y2="316" stroke="#65BFF5" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
