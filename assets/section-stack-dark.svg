<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" role="img" aria-label="02 / Tech stack">
  <style>
    .mobile-layout { display: none; }
    @media (max-width: 560px) {
      .desktop-layout { display: none; }
      .mobile-layout { display: block; }
    }
  </style>
  <defs>
    <linearGradient id="sec-bg-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19233A"/>
      <stop offset="60%" stop-color="#151D30"/>
      <stop offset="100%" stop-color="#19233A"/>
    </linearGradient>
  </defs>
  <rect x="1" y="4" width="878" height="88" rx="18" fill="url(#sec-bg-dark)" stroke="#31405E" stroke-width="1.2"/>
  <rect x="20" y="20" width="6" height="56" rx="3" fill="#65BFF5"/>

  <g class="desktop-layout" font-family="'Noto Sans JP', 'Yu Gothic UI', 'Segoe UI', 'Meiryo', sans-serif">
    <text x="42" y="37" font-size="13" font-weight="600" letter-spacing="2" fill="#A8B7D1">OWO2525 / 02</text>
    <line x1="186" y1="32.5" x2="232" y2="32.5" stroke="#65BFF5" stroke-width="2.2" stroke-linecap="round"/>
    <text x="42" y="72" font-size="28" font-weight="700" fill="#F4F8FF">Tech stack</text>
    <rect x="726" y="30" width="130" height="36" rx="12" fill="#1E2942" stroke="#344566" stroke-width="1"/>
    <text x="791" y="52.5" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="1.4" fill="#A8D8F0">TOOLKIT</text>
  </g>

  <g class="mobile-layout" font-family="'Noto Sans JP', 'Yu Gothic UI', 'Segoe UI', 'Meiryo', sans-serif">
    <text x="46" y="35" font-size="20" font-weight="600" letter-spacing="2.2" fill="#A8B7D1">OWO2525 / 02</text>
    <line x1="264" y1="29" x2="332" y2="29" stroke="#65BFF5" stroke-width="3" stroke-linecap="round"/>
    <text x="46" y="77" font-size="38" font-weight="700" fill="#F4F8FF">Tech stack</text>
  </g>
